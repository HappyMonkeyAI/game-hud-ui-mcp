[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-hud-ui-mcp"
version = "0.1.0"
description = "Read-only MCP advisor for in-game HUDs, menus, Three.js overlays, and game UI references"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
game-hud-ui-advisor = "game_hud_ui_advisor.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
